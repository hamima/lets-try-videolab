services:
  - type: web
    name: vidlife
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn tasks:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: ALLOWED_ORIGINS
        value: https://vidlife.pages.dev,http://localhost:5173
      # Required — without it, sign-in 500s with "GOOGLE_CLIENT_ID is not
      # configured" (settings.py falls back to this env var only when
      # settings.json doesn't exist yet, which is always true on a fresh
      # deploy). sync: false means Render prompts for the value in the
      # dashboard instead of storing it here. Must match the OAuth Client
      # ID's authorized JavaScript origins in Google Cloud Console (the
      # frontend's deployed origin) — see docs/authentication.md.
      - key: GOOGLE_CLIENT_ID
        sync: false
