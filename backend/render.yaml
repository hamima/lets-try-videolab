services:
  - type: web
    name: my-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn tasks:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: ALLOWED_ORIGINS
        value: https://my-app.pages.dev,http://localhost:5173